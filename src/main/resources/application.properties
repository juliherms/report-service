spring.application.name=report-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/reportdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=reportuser
spring.datasource.password=reportpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Scripts Configuration
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
